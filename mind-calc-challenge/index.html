<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mind Calc Challenge</title>
    <script>
        (function () {
            try {
                var t = localStorage.getItem("bgjs_theme") || "light";
                document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
            } catch (e) {
                document.documentElement.setAttribute("data-theme", "light");
            }
        })();
    </script>
    <link rel="stylesheet" href="../css/shared-ui.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="icon" type="image/svg+xml" href="materials/mc-favicon.svg">
</head>

<body>
    <header class="appElement">
        <h1 title="click to see rules">Mind Calc Challenge</h1>
        <div class="header-actions">
            <button type="button" id="concentrationBtn" class="btn btn-ghost" title="Concentration mode"
                aria-label="Concentration mode">C</button>
            <button type="button" id="settingsGear" title="Settings" aria-label="Open settings">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path
                        d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z">
                    </path>
                </svg>
            </button>
        </div>
    </header>

    <main id="main" class="appElement">
        <div id="playground">--</div>
        <input type="text" name="userAnswer" id="userAnswer" placeholder="answer" autocomplete="off" maxlength="3"
            inputmode="numeric" onkeyup="this.value = this.value.replace (/[^0-9+]/, '')">

        <button type="button" id="playBtn" class="game-button btn btn-primary btn-block">Play</button>
        <button type="button" id="nextBtn" class="game-button btn btn-primary btn-block">Next</button>
        <button type="button" id="commitBtn" class="game-button btn btn-primary btn-block">Commit Answer</button>

        <progress max="100" value="0"></progress>
    </main>

    <footer class="appElement">
        <section class="socials">
            <a href="mailto:maxeleron@gmail.com" id="ownersMail" class="socialLink" title="Email" aria-label="Email">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                    <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                </svg>
            </a>
            <a href="https://github.com/maxeleron" id="ownersGitHub" class="socialLink" title="My GitHub account"
                aria-label="GitHub">
                <img src="materials/GitHub-Mark-64px.png" alt="GitHub profile link">
            </a>
        </section>
    </footer>

    <div id="rulesWindow" role="dialog" aria-labelledby="rulesTitle" aria-modal="true">
        <h2 id="rulesTitle">Game Rules</h2>
        <p class="u-text-secondary">Click the title anytime to reopen these rules. Solve color-based arithmetic as fast
            as you can.</p>
        <button type="button" id="closeRulesWindow" class="closeWinBtn btn btn-secondary">Close</button>
    </div>

    <div id="settingsWindow" role="dialog" aria-labelledby="mccSettingsTitle" aria-modal="true">
        <h2 id="mccSettingsTitle">Settings</h2>
        <table id="settingsTable">
            <tr>
                <td>Amount of questions</td>
                <td><input type="number" id="questionsAmount" value="10" min="1" max="50"></td>
            </tr>
            <tr>
                <td colspan="2"><strong>Colors and values</strong></td>
            </tr>
            <tr id="1RuleRow">
                <td>
                    <label for="colorRuleValue">Color rule offset</label>
                </td>
                <td><input type="number" id="colorRuleValue" value="2" step="1"></td>
            </tr>
            <tr>
                <td>
                    <label for="hintsCheckbox">Turn ON / OFF hints:</label>
                </td>
                <td>
                    <input type="checkbox" id="hintsCheckbox" checked>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="progressCheckbox">Turn ON / OFF progress:</label>
                </td>
                <td>
                    <input type="checkbox" id="progressCheckbox" checked>
                </td>
            </tr>
        </table>

        <div class="form-row">
            <span class="form-label">Theme</span>
            <div class="theme-toggle" role="radiogroup" aria-label="Color theme">
                <label>
                    <input type="radio" name="bgjs_theme" value="light" checked>
                    Light
                </label>
                <label>
                    <input type="radio" name="bgjs_theme" value="dark">
                    Dark
                </label>
            </div>
        </div>

        <button type="button" id="saveLocalSettings" class="u-hidden" aria-hidden="true"></button>
        <button type="button" id="closeSettingsWindow" class="closeWinBtn btn btn-secondary">Close</button>
    </div>

    <a id="backToFullMode" href="#">Back to full version</a>

    <script src="../js/theme.js"></script>
    <script src="js/mind-calc-engine.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
