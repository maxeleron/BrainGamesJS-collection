<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Colors Order Challenge</title>
    <script>
        (function () {
            try {
                var t = localStorage.getItem("bgjs_theme") || "light";
                document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
            } catch (e) {
                document.documentElement.setAttribute("data-theme", "light");
            }
        })();
    </script>
    <link rel="stylesheet" href="../css/shared-ui.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="icon" type="image/svg+xml" href="materials/co-favicon.svg">
</head>

<body>
    <header class="appElement">
        <h1>Colors Order Challenge</h1>
        <div class="header-actions">
            <button type="button" id="themeToggleBtn" aria-label="Toggle theme" aria-pressed="false">
                <svg class="theme-icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="4"></circle>
                    <path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path>
                </svg>
                <svg class="theme-icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 12.79A9 9 0 0 1 11.21 3 9 9 0 1 0 21 12.79z"></path>
                </svg>
            </button>
            <button type="button" id="settingsGear" title="Settings" aria-label="Open settings">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path
                        d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z">
                    </path>
                </svg>
            </button>
        </div>
    </header>

    <main class="appElement">
        <div id="gameRules">
            Game is simple:
            <ol>
                <li>Remember order of color tiles</li>
                <li>Restore order after shuffling</li>
                <li>More options in settings</li>
            </ol>
        </div>

        <div id="playground"></div>

        <div id="quickSettings">
            <label for="tilesAmount">Tiles amount
                <input type="number" id="tilesAmount" max="36" min="2" value="8">
            </label>

            <div class="form-row">
                <span class="form-label" id="tileSizeLabel">Tile size</span>
                <div id="tileSize" class="segmented-control" role="radiogroup" aria-labelledby="tileSizeLabel">
                    <label>
                        <input type="radio" name="tileSize" value="small">
                        Small
                    </label>
                    <label>
                        <input type="radio" name="tileSize" value="medium" checked>
                        Medium
                    </label>
                    <label>
                        <input type="radio" name="tileSize" value="large">
                        Large
                    </label>
                </div>
            </div>

            <div class="form-row">
                <span class="form-label" id="tileDisplayLabel">Tile display</span>
                <div id="tileDisplay" class="segmented-control" role="radiogroup" aria-labelledby="tileDisplayLabel">
                    <label>
                        <input type="radio" name="tileDisplay" value="horizontal" checked>
                        Horizontal
                    </label>
                    <label>
                        <input type="radio" name="tileDisplay" value="vertical">
                        Vertical
                    </label>
                    <label>
                        <input type="radio" name="tileDisplay" value="cubic">
                        Cubic
                    </label>
                </div>
            </div>
        </div>

        <div class="action-buttons-container">
            <button type="button" id="playBtn" class="button btn btn-primary btn-block">Play</button>
            <button type="button" id="changeSettingsBtn" class="button btn btn-secondary" style="display: none;">Change Settings</button>
        </div>

        <button type="button" id="toggleFooterBtn" class="footer-toggle" aria-label="Toggle footer visibility"
            aria-controls="gameFooter" aria-expanded="true" title="Collapse footer">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m18 15-6-6-6 6"></path>
            </svg>
        </button>
    </main>

    <footer class="appElement" id="gameFooter">
        <section class="socials" id="footerSocials">
            <a href="mailto:maxeleron@gmail.com" class="socialLink" title="Email" aria-label="Email">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                    <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                </svg>
            </a>
            <a href="https://github.com/maxeleron" class="socialLink" title="My GitHub account" aria-label="GitHub">
                <img src="materials/GitHub-Mark-64px.png" alt="GitHub profile link">
            </a>
        </section>
    </footer>

    <div id="settingsWindow" class="appElement" role="dialog" aria-labelledby="settingsTitle" aria-modal="true">
        <h2 id="settingsTitle">Settings</h2>

        <label for="gameRulesToggle">
            <input type="checkbox" id="gameRulesToggle" checked>
            Show game rules
        </label>

        <div class="modal-actions">
            <button type="button" id="restoreSettings" class="button btn btn-secondary">Restore defaults</button>
            <button type="button" id="saveLocalSettings" class="button btn btn-primary">Save Settings</button>
            <button type="button" id="closeSettingsWindow" class="button btn btn-secondary">Close</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js" defer></script>
    <script src="../js/theme.js" defer></script>
    <script src="js/main.js" defer></script>
    <script src="js/colors-order-engine.js" defer></script>
    <script src="js/game.js" defer></script>
</body>

</html>
